<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neon Tic Tac Toe</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- SPLASH -->
<div id="splash" class="splash">
  <h1 id="title" class="title">✨ Neon Tic Tac Toe ✨</h1>

  <div id="menu" class="menu hidden">
    <button id="pvpBtn">Player vs Player</button>
    <button id="pvcBtn">Player vs Computer</button>
  </div>
</div>

<!-- GAME -->
<div id="game" class="game hidden">
  <div id="status" class="status"></div>

  <div class="board">
    <div class="cell" data-i="0"></div>
    <div class="cell" data-i="1"></div>
    <div class="cell" data-i="2"></div>
    <div class="cell" data-i="3"></div>
    <div class="cell" data-i="4"></div>
    <div class="cell" data-i="5"></div>
    <div class="cell" data-i="6"></div>
    <div class="cell" data-i="7"></div>
    <div class="cell" data-i="8"></div>
  </div>
</div>

<!-- POPUP -->
<div id="resultPopup" class="popup hidden">
  <div class="popup-box">
    <h2 id="popupWinner">X WON 🏆</h2>
    <p class="popup-sub">New Match ?</p>
    <div class="popup-buttons">
      <button id="yesBtn">YES</button>
      <button id="quitBtn">QUIT</button>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
